<style>
:root{--bg:#0E1519;--s1:#151F25;--s2:#1C2830;--s3:#0A1013;--bd:#2A3A44;--tx:#E8EEF1;--mu:#9FB0BA;--mu2:#B9C7CF;--g:#3DD6B5;--r:#FF8A6B;--b:#6FB4FF;--y:#F2C14E;--rd:#FF6B6B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;line-height:1.6}
button,input{font-family:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
.wrap{max-width:1360px;margin:0 auto;padding:0 32px 56px;display:flex;flex-direction:column;gap:22px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;padding:18px 0;border-bottom:1px solid var(--bd)}
.logo{display:flex;align-items:center;gap:12px}
.logo i{width:40px;height:40px;border-radius:10px;background:var(--g);color:var(--bg);display:flex;align-items:center;justify-content:center;font:500 18px 'JetBrains Mono',monospace;font-style:normal}
.logo b{font-size:18px;display:block}
.logo small{font:12px 'JetBrains Mono',monospace;color:var(--mu);direction:ltr;display:block;text-align:right}
nav{display:flex;flex-wrap:wrap;gap:6px}
nav button{min-height:44px;padding:0 16px;border-radius:10px;border:none;background:transparent;color:var(--mu);font-size:14px}
nav button.on{background:var(--s2);color:var(--tx);font-weight:600}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:22px}
.row{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
h1,h2,h3{margin:0}
h2{font-size:18px}
.mu{color:var(--mu);font-size:13px}
.btn{min-height:46px;padding:0 22px;border-radius:12px;border:none;background:var(--g);color:var(--bg);font-weight:700;font-size:15px}
.btn.o{background:transparent;border:1px solid var(--g);color:var(--g)}
.btn.r{background:var(--r)}
.btn.y{background:var(--y)}
.btn.b{background:transparent;border:1px solid var(--b);color:var(--b)}
.btn:disabled{opacity:.4}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:3px 11px;background:var(--bd);color:var(--mu2)}
.bar{height:8px;border-radius:99px;background:var(--bd);overflow:hidden}
.bar>div{height:100%}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.stat{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:18px}
.stat span{display:block;font-size:13px;color:var(--mu)}
.stat b{display:block;font-size:28px;margin:4px 0 2px}
.console{background:var(--s3);border:1px solid var(--bd);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.console .hd{display:flex;justify-content:space-between;padding:12px 18px;background:var(--s1);border-bottom:1px solid var(--bd);font-size:14px;font-weight:600}
.console .out{direction:ltr;text-align:left;font:13px/1.75 'JetBrains Mono',monospace;padding:16px 18px;height:340px;overflow:auto;white-space:pre-wrap}
.console .in{direction:ltr;display:flex;align-items:center;gap:8px;padding:10px 18px;border-top:1px solid var(--bd);background:var(--s1);font:13px 'JetBrains Mono',monospace}
.console input{flex:1;min-height:40px;background:transparent;border:none;outline:none;color:var(--tx);font:13px 'JetBrains Mono',monospace}
.chip{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--g);background:transparent;color:var(--g);font:13px 'JetBrains Mono',monospace;direction:ltr}
.node{border:2px solid var(--bd);border-radius:12px;padding:12px 14px;background:var(--s2)}
.mono{font-family:'JetBrains Mono',monospace;direction:ltr;display:inline-block}
.task{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--bd);font-size:14px}
.task i{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid #4A5D69;font-style:normal;font-size:13px;font-weight:700;color:var(--bg);display:flex;align-items:center;justify-content:center}
.task.ok i{background:var(--g);border-color:var(--g)}
.sel{width:100%;text-align:right;border:2px solid var(--bd);background:var(--s1);color:var(--tx);border-radius:12px;padding:12px 14px;font-size:14px}
.sel.on{border-color:var(--b);background:var(--s2)}
.tbl{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.6fr) 70px 110px;align-items:center;gap:8px}
input.txt{min-height:44px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--bd);background:var(--s3);color:var(--tx);font-size:14px}
.tl{display:grid;grid-template-columns:80px minmax(0,1fr) minmax(0,1fr);font-size:14px}
.tl>div{padding:12px;border-top:1px solid var(--bd)}
.banner{font-size:12px;font-weight:600;color:var(--bg);background:var(--g);border-radius:999px;padding:6px 12px}

[data-theme="light"]{color-scheme:light;--bg:#F3F6F9;--s1:#FFFFFF;--s2:#EAF0F5;--s3:#0A1013;--bd:#CAD6DF;--tx:#14212B;--mu:#546A78;--mu2:#33495A;--g:#087A67;--r:#C8431A;--b:#1F66C8;--y:#9A6200;--rd:#C62828}
[data-theme="neon"]{--bg:#05090B;--s1:#0B1418;--s2:#101D23;--s3:#020506;--bd:#164046;--tx:#DFFBF3;--mu:#7FB5AA;--mu2:#A8D8CE;--g:#19F0B4;--r:#FF7A3D;--b:#38B6FF;--y:#FFD23F;--rd:#FF4D6D}
[data-theme="neon"] .card,[data-theme="neon"] .stat{box-shadow:0 0 0 1px rgba(25,240,180,.07),0 0 26px rgba(25,240,180,.07)}
.console{--s1:#151F25;--s3:#0A1013;--bd:#2A3A44;--tx:#E8EEF1;--mu:#9FB0BA;--mu2:#B9C7CF;--g:#3DD6B5;--r:#FF8A6B;--b:#6FB4FF;--y:#F2C14E;--rd:#FF6B6B}
body{transition:background .25s,color .25s}
body::before{content:'';position:fixed;left:0;bottom:0;width:360px;height:360px;background:var(--art) no-repeat left bottom/contain;opacity:.06;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1}
.btn{transition:transform .15s,filter .15s}.btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.08)}
.sel:hover:not(:disabled){border-color:var(--b)}
.hero{position:relative;overflow:hidden;background:radial-gradient(circle at 85% 20%,color-mix(in srgb,var(--g) 14%,transparent),transparent 55%),var(--s1)}
.art{position:relative;flex:0 1 280px;display:flex;justify-content:center;align-items:center;min-height:200px}
.hero-art{position:relative;width:100%;max-width:280px;height:auto;animation:float 6s ease-in-out infinite}
.orbit{position:absolute;width:88%;aspect-ratio:1;border:2px dashed var(--b);border-radius:50%;opacity:.3;animation:spin 50s linear infinite}
.thm{display:flex;gap:4px;background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:4px}
.thm button{min-height:36px;padding:0 12px;border:none;border-radius:8px;background:transparent;color:var(--mu2);font-size:13px}
.thm button.on{background:var(--g);color:var(--bg);font-weight:700}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.hero-art,.orbit{animation:none}}
@media(max-width:900px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:1fr}.tbl{grid-template-columns:1fr 1fr}}
</style>
</head>

function runCmd(raw){
  const L = S.lab, c = raw.trim(); if (!c) return;
  const P = (t, col) => L.log.push({ t, c: col || '#B9C7CF' });
  L.log.push({ t: 'arena > ' + c, c: '#E8EEF1' });
  const parts = c.split(/\s+/), cmd = parts[0].toLowerCase(), arg = parts.slice(1).join(' ');
  if (cmd === 'clear') { L.log = []; }
  else if (cmd === 'help') {
    P('Available commands (simulation only):');
    P('  scan 10.10.0.0/24           discover lab hosts');
    P('  vuln-info web-srv-01        show vulnerability card');
    P('  sim-run training/outdated_cms   run the educational module');
    P('  status                      show lab state');
    P('  clear                       clear the screen');
  }
  else if (cmd === 'scan') {
    if (arg && arg !== '10.10.0.0/24') { P('[SIM] target outside the lab network. Only 10.10.0.0/24 is allowed.', '#FF8A6B'); }
    else {
      if (!L.scanned) ev('مسح الشبكة الداخلية داخل المحاكاة', 'ظهر تنبيه IDS متوسط ولم يُفحص');
      L.scanned = true;
      P('[SIM] 3 hosts up', '#3DD6B5');
      P('10.10.0.11  ws-student   ports: 22');
      P('10.10.0.20  web-srv-01   ports: 80,443   cms v2.1 (outdated)', '#F2C14E');
      P('10.10.0.30  db-srv-02    ports: 5432');
    }
  }
  else if (cmd === 'vuln-info') {
    if (arg && arg !== 'web-srv-01') { P('[SIM] no vulnerability card for "' + arg + '". Try: vuln-info web-srv-01', '#FF8A6B'); }
    else {
      if (!L.info) ev('مراجعة بطاقة الثغرة للخادم', 'لا يوجد أثر في السجلات');
      L.info = true;
      P('[SIM] CVE-SIM-0001  severity: HIGH (8.1)', '#FF8A6B');
      P('type: remote code execution (fictional, educational)');
      P('fix: upgrade cms to v2.4, restrict admin panel', '#3DD6B5');
    }
  }
  else if (cmd === 'sim-run') {
    if (arg && arg !== 'training/outdated_cms') { P('[SIM] unknown module. Try: sim-run training/outdated_cms', '#FF8A6B'); }
    else if (!L.scanned || !L.info) { P('[SIM] run scan and vuln-info first.', '#F2C14E'); }
    else {
      if (!L.ran) ev('تشغيل وحدة المحاكاة التعليمية وفتح جلسة محاكاة', 'تنبيه WAF عالٍ ثم EDR حرج');
      L.ran = true;
      P('[SIM] module: training/outdated_cms (educational only)');
      P('[SIM] web-srv-01 state: compromised (simulated)', '#FF8A6B');
      P('[SIM] session 1 opened (simulated, no real connection)', '#F2C14E');
      P('[SIM] switch to the Blue Team view to see the alerts.', '#6FB4FF');
    }
  }
  else if (cmd === 'status') {
    P('web-srv-01: ' + webState()[0]);
    P('tasks done: ' + labDone() + ' / 5');
  }
  else { P('[SIM] unknown command: ' + cmd + '. Type "help".', '#FF8A6B'); }
  save();
}

  const list = SESSIONS.map(s => {
    const x = v[s.id]; let tag = 'بانتظار الحكم', bg = 'var(--bd)', fg = 'var(--mu2)';
    if (x) { const ok = (x === 'kill') === s.bad; tag = ok ? 'حكم صحيح' : 'حكم خاطئ'; bg = ok ? 'var(--g)' : 'var(--r)'; fg = 'var(--bg)'; }
    return `<button class="sel ${sel.id === s.id ? 'on' : ''}" data-a="pick" data-id="${s.id}"><div style="display:flex;justify-content:space-between;align-items:center"><span class="mono" style="font-size:13px">${s.id} · ${s.user}</span><span class="pill" style="background:${bg};color:${fg}">${tag}</span></div><div class="mu" style="margin-top:6px"><span class="mono">${s.host}</span> · ${s.when}</div></button>`;
  }).join('');
  const logs = sel.logs.map(l => `<div style="color:${l[1]}">${esc(l[0])}</div>`).join('');
  const x = v[sel.id]; let fb = '';

  <div class="col">

   <div class="card" style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;align-items:center"><p style="margin:0;color:var(--mu2);flex:1 1 480px">افتح سجل كل جلسة ثم قرّر: مشروعة أم تُنهى وتُعزل. الهدف قراءة الأثر في السجلات.</p><span>تم الحكم <b style="color:var(--y)">${t.judged}/4</b> · صحيح <b style="color:var(--g)">${t.correct}</b></span></div>
   <div class="row">
    <div class="col" style="flex:1 1 340px"><div class="card col" style="gap:10px;padding:16px"><h2>الجلسات النشطة</h2>${list}</div></div>
    <div class="col" style="flex:2 1 520px">
     <div class="console"><div class="hd"><span>سجل الجلسة</span><span class="mono mu" style="font-size:12px">${sel.id} · ${sel.user} @ ${sel.host}</span></div><div class="out" style="height:200px">${logs}</div></div>
     <div class="card col" style="gap:14px">
      <div style="display:flex;flex-wrap:wrap;gap:24px"><div><div class="mu">المستخدم</div><span class="mono">${sel.user}</span></div><div><div class="mu">المصدر</div><span class="mono">${sel.src}</span></div><div><div class="mu">البدء</div>${sel.when}</div><div><div class="mu">السياق</div>${sel.ctx}</div></div>
      <div style="display:flex;flex-wrap:wrap;gap:12px"><button class="btn o" data-a="verdict" data-x="legit" style="flex:1 1 220px">جلسة مشروعة · تابع المراقبة</button><button class="btn r" data-a="verdict" data-x="kill" style="flex:1 1 220px">مشبوهة · أنهِ الجلسة واعزل الجهاز</button></div>${fb}

    </div>

  </div>`;
}

function vDebrief(){
  const L = S.lab, sk = skills(), sc = score(), any = labDone() > 0 || s2Stats().judged > 0;
  const bars = sk.map(k => `<div style="display:flex;align-items:center;gap:14px;margin:12px 0"><span style="flex:0 0 130px;font-size:14px">${k[0]}</span><div class="bar" style="flex:1"><div style="width:${k[1]}%;background:${colorFor(k[1])}"></div></div><b style="flex:0 0 44px;text-align:left">${k[1]}</b></div>`).join('');
  const evs = L.events.concat(L.choice ? [{ t: '—', red: '—', blue: 'اختيار الإجراء: ' + CHOICES[L.choice][0] }] : []);
  const tl = evs.length ? evs.map(e => `<div class="mono mu" style="font-size:13px;text-align:right">${e.t}</div><div>${e.red}</div><div style="color:var(--b)">${e.blue}</div>`).join('') : '<div style="grid-column:1/-1" class="mu">لا أحداث بعد. نفّذ أوامر في المختبر ليظهر الجدول الزمني هنا.</div>';
  let note;
  if (!any) note = 'لم تنفّذ شيئاً بعد. ابدأ من المختبر ٠١.';
  else if (L.choice === 'isolate') note = 'قرار العزل كان صحيحاً. اربط التنبيه المبكر بالنشاط اللاحق لتحتوي الحادث قبل فتح الجلسة.';
  else if (L.ran && !L.choice) note = 'نُفّذت المحاكاة لكنك لم تختر إجراء دفاعياً بعد. بدّل إلى الفريق الأزرق وأكمل.';
  else note = 'تقدّم جيد. أكمل المهام المتبقية في المختبر والسيناريو ٠٢.';
  return `
  <div class="col">
   <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px"><div><span class="mu">تقرير ما بعد التمرين</span><h1 style="font-size:24px">ملخّص أدائك</h1></div><button class="btn" data-a="go" data-v="lab">العودة للمختبر</button></div>
   <div class="row">
    <div class="card" style="flex:1 1 280px;padding:28px"><span class="mu">النتيجة الإجمالية</span><div style="font-size:64px;font-weight:700;color:var(--g);line-height:1.1">${sc}<span style="font-size:22px;color:var(--mu)">/100</span></div><p class="mu" style="margin:6px 0 0">50 نقطة للمختبر ٠١ و50 للسيناريو ٠٢.</p></div>
    <div class="card" style="flex:2 1 520px"><h2>المهارات</h2>${bars}</div>
   </div>
   <div class="card"><h2 style="margin-bottom:10px">ماذا فعل الأحمر وماذا رأى الأزرق؟</h2><div class="tl"><div class="mu" style="border:none">الوقت</div><div style="border:none;color:var(--r);font-weight:600">الفريق الأحمر (المحاكاة)</div><div style="border:none;color:var(--b);font-weight:600">الفريق الأزرق (الكشف)</div>${tl}</div></div>
   ${mitreMatrix()}
   <div class="card"><h2 style="margin-bottom:6px">ملاحظة</h2><p style="margin:0;color:var(--mu2)">${note}</p></div>
  </div>`;
}

function runVCmd(raw){
  const v = curV(), p = vp(), c = raw.trim(); if (!c) return;
  const P = (t, col) => p.log.push({ t, c: col || '#B9C7CF' });
  p.log.push({ t: 'arena > ' + c, c: '#E8EEF1' });
  const parts = c.split(/\s+/), cmd = parts[0].toLowerCase(), arg = parts.slice(1).join(' ');
  if (cmd === 'hint') {
    p.hints = (p.hints || 0) + 1;
    const nxt = v.tools ? (v.tools.find((t, k) => !p[['scanned', 'info', 'ran'][k]]) || [null])[0] : (!p.scanned ? 'scan 10.10.0.0/24' : !p.info ? 'vuln-info ' + v.host : !p.ran ? 'sim-run training/' + v.mod : null);
    P(nxt ? '[HINT] next step: ' + nxt + '   (-5 points)' : '[HINT] switch to the Blue Team view and choose the response   (-5 points)', '#F2C14E');
  }
  else if (v.tools && (cmd === 'man' || parts[1] === '--help')) {
    const nm = cmd === 'man' ? (parts[1] || '') : cmd;
    if (TOOLDOC[nm] && v.tools.some(t => t[0].split(' ')[0] === nm)) P(nm + ': ' + TOOLDOC[nm]); else P('[SIM] no manual entry for "' + nm + '" in this lab.', '#FF8A6B');
  }
  else if (v.tools && cmd !== 'clear' && cmd !== 'status') {
    let i = v.tools.findIndex(t => t[0] === c.replace(/\s+/g, ' ')); if (i < 0) i = v.tools.findIndex(t => t[0].split(' ')[0] === cmd); const fl = ['scanned', 'info', 'ran'];
    if (cmd === 'help') { P('Lab tools (simulated outputs only), run them in order:'); v.tools.forEach((t, k) => P('  ' + (k + 1) + '. ' + t[0] + '   [' + t[1] + ']')); P('  hint   man <tool>   <tool> --help   status   clear'); }
    else if (i < 0) P('[SIM] tool not found: ' + cmd + '. Type "help" to list the lab tools.', '#FF8A6B');
    else if (i > 0 && !p[fl[i - 1]]) P('[SIM] run ' + v.tools[i - 1][0].split(' ')[0] + ' first.', '#F2C14E');
    else { p[fl[i]] = true; P('[' + v.tools[i][1] + '] ' + v.tools[i][0], '#6FB4FF'); v.tools[i][2].forEach(l => l[0] === '!' ? P(l.slice(1), '#FF8A6B') : P(l)); P(i === 2 ? '[SIM] switch to the Blue Team view to see the alerts.' : '[SIM] output is pre-written. No real tool was run.', '#6FB4FF'); }
  }
  else if (cmd === 'clear') { p.log = []; }
  else if (cmd === 'help') {
    P('Available commands (simulation only):');
    P('  scan 10.10.0.0/24                 discover lab hosts');
    P('  vuln-info ' + v.host + '          show vulnerability card');
    P('  sim-run training/' + v.mod + '    run the educational module');
    P('  hint                              next-step hint (-5 points)');
    P('  status                            show lab state');
    P('  clear                             clear the screen');
  }
  else if (cmd === 'scan') {
    if (arg && arg !== '10.10.0.0/24') P('[SIM] target outside the lab network. Only 10.10.0.0/24 is allowed.', '#FF8A6B');
    else {
      p.scanned = true;
      P('[SIM] 3 hosts up', '#3DD6B5');
      P('10.10.0.11  ws-student   ports: 22');
      P(v.ip + '  ' + v.host + '   ' + v.svc, '#F2C14E');
      P('10.10.0.30  db-srv-02    ports: 5432');
    }
  }
  else if (cmd === 'vuln-info') {
    if (arg && arg !== v.host) P('[SIM] no vulnerability card for "' + arg + '". Try: vuln-info ' + v.host, '#FF8A6B');
    else {
      p.info = true;
      P('[SIM] ' + v.cve + '  severity: ' + v.sev, '#FF8A6B');
      P('affected: ' + v.sys);
      P('type: ' + v.type + ' (public knowledge, educational)');
      P('fix: see the Blue Team view for the recommended response', '#3DD6B5');
    }
  }
  else if (cmd === 'sim-run') {
    if (arg && arg !== 'training/' + v.mod) P('[SIM] unknown module. Try: sim-run training/' + v.mod, '#FF8A6B');
    else if (!p.scanned || !p.info) P('[SIM] run scan and vuln-info first.', '#F2C14E');
    else {
      p.ran = true;
      P('[SIM] module: training/' + v.mod + ' (educational only)');
      P('[SIM] ' + v.host + ' state: compromised (simulated)', '#FF8A6B');
      P('[SIM] no real connection was made. No exploit code is included.', '#F2C14E');
      P('[SIM] switch to the Blue Team view to see the alerts.', '#6FB4FF');
    }
  }
  else if (cmd === 'status') { P(v.host + ': ' + vState(p)[0]); P('tasks done: ' + vDone(p) + ' / 5'); }
  else P('[SIM] unknown command: ' + cmd + '. Type "help".', '#FF8A6B');
  save();
}

function vVulns(){
  const t2 = s2Stats(), d1 = labDone();
  const done = vTotal() + (S.lab.choice === 'isolate' ? 1 : 0) + (t2.judged === 4 ? 1 : 0) + chainsDone();
  const stt = (ok, started) => ok ? ['مكتمل', 'var(--g)', 'var(--bg)'] : started ? ['قيد التنفيذ', 'var(--y)', 'var(--bg)'] : ['لم يبدأ', 'var(--bd)', 'var(--mu2)'];
  const base = [
    { no:'٠١', n:'الخادم المعرَّض للثغرة', cve:'CVE-SIM-0001', sys:'نظام محتوى قديم (CMS)', sev:'عالٍ', dom:'مختبر معزول', v:'lab', pct:d1 * 20, st:stt(S.lab.choice === 'isolate', d1 > 0) },
    { no:'٠٢', n:'من الجلسة المشروعة ومن المشبوهة؟', cve:'مراقبة الجلسات', sys:'سجلات الجلسات النشطة', sev:'—', dom:'الفريق الأزرق', v:'lab2', pct:t2.judged * 25, st:stt(t2.judged === 4, t2.judged > 0) }
  ].concat(CH.map(c => { const C = S.ch[c.id]; return { no:c.no, n:c.n, cve:'MITRE ATT&CK · 5 مراحل', sys:c.sys, sev:'حرج', dom:'Kill Chain · متعدد المراحل', c:c.id, pct:chainDone(c.id) ? 100 : C ? C.decided * 20 : 0, st:stt(chainDone(c.id), !!(C && C.step > 0)) }; })).map(b => `<div class="card col" style="gap:10px;padding:20px">
     <div style="display:flex;justify-content:space-between;align-items:center"><span class="mu mono">${b.no}</span><span class="pill" style="background:${b.st[1]};color:${b.st[2]}">${b.st[0]}</span></div>
     <h3>${b.n}</h3>
     <div class="mu mono" style="font-size:12px">${b.cve}</div>
     <div style="display:flex;justify-content:space-between;font-size:14px"><span class="mu">النظام</span><span>${b.sys}</span></div>
     <div style="display:flex;justify-content:space-between;font-size:14px"><span class="mu">مستوى الخطورة</span><b style="color:${b.sev === '—' ? 'var(--mu2)' : 'var(--r)'}">${b.sev}</b></div>
     <div style="display:flex;justify-content:space-between;font-size:14px"><span class="mu">المجال</span><span>${b.dom}</span></div>
     <div class="bar"><div style="width:${b.pct}%;background:var(--g)"></div></div>
     <button class="btn o" ${b.c ? 'data-a="copen" data-id="' + b.c + '"' : 'data-a="go" data-v="' + b.v + '"'}>فتح السيناريو</button></div>`).join('');
  const cards = base + VULNS.map(v => {
    const p = vpr(v.id), st = p.choice === 'fix' ? ['مكتمل', 'var(--g)', 'var(--bg)'] : vDone(p) ? ['قيد التنفيذ', 'var(--y)', 'var(--bg)'] : ['لم يبدأ', 'var(--bd)', 'var(--mu2)'];
    return `<div class="card col" style="gap:10px;padding:20px">
     <div style="display:flex;justify-content:space-between;align-items:center"><span class="mu mono">${v.no}</span><span class="pill" style="background:${st[1]};color:${st[2]}">${st[0]}</span></div>
     <h3>${v.n}</h3>
     <div class="mu mono" style="font-size:12px">${v.cve}</div>
     <div style="display:flex;justify-content:space-between;font-size:14px"><span class="mu">النظام المتأثر</span><span>${v.sys}</span></div>
     <div style="display:flex;justify-content:space-between;font-size:14px"><span class="mu">مستوى الخطورة</span><b style="color:${sevColor(v.sev)}">${v.sev}</b></div>
     <div style="display:flex;justify-content:space-between;font-size:14px"><span class="mu">المجال</span><span>${v.dom}</span></div>
     <div class="bar"><div style="width:${vDone(p) * 20}%;background:var(--g)"></div></div>
     <button class="btn o" data-a="vopen" data-id="${v.id}">فتح السيناريو</button></div>`;
  }).join('');
  return `
  <div class="col" style="gap:22px">
   <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px"><div style="display:flex;align-items:center;gap:14px"><img src="${ART}" alt="" style="width:64px;height:64px;object-fit:contain"><div><span class="mu">السيناريوهات ٠١ إلى ٢٦</span><h1 style="font-size:24px">مكتبة الثغرات</h1></div></div><span>أُنجز <b style="color:var(--g)">${done} / ${VULNS.length + 2 + CH.length}</b></span></div>
   <div class="card"><p style="margin:0;color:var(--mu2)">المختبر ٠١ والسيناريو ٠٢ ثم عشرة سيناريوهات على ثغرات معروفة (٠٣–١٢) وثمانية سيناريوهات تستخدم أدوات كالي الشائعة في الاستطلاع والتحليل الجنائي وجمع البيانات والوصول إلى بيانات الاعتماد (١٣–٢٠)، ثم ست سلاسل هجوم كاملة (٢١–٢٦) تتخذ فيها قرار الدفاع في كل مرحلة. كل سيناريو يحتوي مختبراً افتراضياً: امسح، اقرأ بطاقة الثغرة، شغّل وحدة محاكاة تعليمية، ثم بدّل إلى الفريق الأزرق واختر الاستجابة. مخرجات الأدوات نصوص محاكاة جاهزة: لا تُشغَّل أي أداة حقيقية ولا يوجد اتصال بأي هدف.</p></div>
   <div class="grid3">${cards}</div>
  </div>`;
}
function vSim(){
  const v = curV(), p = vp(), red = S.v.role === 'red', ws = vState(p), idx = VULNS.indexOf(v), nx = VULNS[idx + 1], mt = MT[v.id];
  const chips = (v.tools ? ['help', 'hint'].concat(v.tools.map(t => t[0]), ['status', 'clear']) : ['help', 'scan 10.10.0.0/24', 'vuln-info ' + v.host, 'sim-run training/' + v.mod, 'hint', 'status', 'clear']).map(c => `<button class="chip" data-a="chip" data-c="${c}">${c}</button>`).join('');
  const tl = [[v.tools ? v.tools[0][1] + ': ' + v.tools[0][0].split(' ')[0] : 'اكتشاف الأجهزة والخدمات (scan)', p.scanned], [v.tools ? v.tools[1][1] + ': ' + v.tools[1][0].split(' ')[0] : 'مراجعة معلومات الثغرة (vuln-info)', p.info], [v.tools ? v.tools[2][1] + ': ' + v.tools[2][0].split(' ')[0] : 'تشغيل وحدة المحاكاة التعليمية (sim-run)', p.ran], ['مشاهدة التنبيهات من منظور الفريق الأزرق', p.saw], ['اختيار إجراء المعالجة الصحيح', p.choice === 'fix']];
  const tasks = tl.map(t => `<div class="task ${t[1] ? 'ok' : ''}"><i>${t[1] ? '✓' : ''}</i><span style="color:${t[1] ? 'var(--tx)' : 'var(--mu2)'}">${t[0]}</span></div>`).join('');
  const log = p.log.map(l => `<div style="color:${l.c}">${esc(l.t)}</div>`).join('');
  let side;
  if (red) {
    side = `<div class="card col" style="border-color:var(--r);gap:12px"><span style="color:var(--r);font-size:12px;font-weight:600">منظور الفريق الأحمر</span><h2>بطاقة الثغرة</h2>
    <div style="display:flex;justify-content:space-between;font-size:14px;gap:10px"><span class="mu">المعرّف</span><span class="mono" style="font-size:12px">${v.cve}</span></div>
    <div style="display:flex;justify-content:space-between;font-size:14px"><span class="mu">الخطورة</span><span style="color:${sevColor(v.sev)};font-weight:600">${v.sev}</span></div>
    <div style="display:flex;justify-content:space-between;font-size:14px;gap:10px"><span class="mu">النظام</span><span>${v.sys}</span></div>
    <div style="display:flex;justify-content:space-between;font-size:14px;gap:10px"><span class="mu">النوع</span><span style="text-align:left">${v.type}</span></div>
    <p class="mu" style="margin:0;border-top:1px solid var(--bd);padding-top:12px">${v.desc} المحاكاة هنا لفهم الخطر والأثر وكيف يُغلق، لا لتنفيذ شيء على نظام حقيقي.</p></div>`;
  } else {
    const al = vAlerts(v, p);
    const alHtml = al.length ? al.map(a => `<div style="border:1px solid var(--bd);border-radius:10px;padding:12px;background:var(--s2)"><div style="display:flex;justify-content:space-between"><b style="color:${a[1]};font-size:12px">${a[0]}</b><span class="mono mu" style="font-size:12px">${a[2]}</span></div><div style="font-size:14px">${a[3]}</div></div>`).join('') : '<p class="mu" style="margin:0">لا تنبيهات بعد. بدّل إلى الفريق الأحمر ونفّذ الأوامر لتظهر هنا.</p>';
    const ch = Object.keys(VCHOICES).map(k => `<button class="sel ${p.choice === k ? 'on' : ''}" data-a="vchoose" data-k="${k}" ${al.length ? '' : 'disabled style="opacity:.5"'}>${k === 'fix' && v.fl ? v.fl : VCHOICES[k][0]}</button>`).join('');
    const fbTxt = p.choice === 'fix' ? (v.fl ? 'صحيح: ' + v.fix + '.' : 'صحيح: العزل يوقف الانتشار، ثم المعالجة: ' + v.fix + '.') : p.choice ? VCHOICES[p.choice][1] : '';
    const fbCol = p.choice === 'fix' ? 'var(--g)' : p.choice ? VCHOICES[p.choice][2] : '';
    const fb = p.choice ? `<p style="margin:0;font-size:14px;color:${fbCol};border-top:1px solid var(--bd);padding-top:10px">${fbTxt}</p>` : '';
    side = `<div class="card col" style="border-color:var(--b);gap:12px"><span style="color:var(--b);font-size:12px;font-weight:600">منظور الفريق الأزرق</span><h2>التنبيهات الواردة</h2>${alHtml}</div>${vSiem(v, p)}
    <div class="card col" style="gap:10px"><h2>ما الإجراء المناسب؟</h2>${ch}${fb}</div>`;
  }
  return `
  <div class="col">
   <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px">
    <div><span class="mu">السيناريو ${v.no} · مختبر معزول</span><h1 style="font-size:22px">${v.n} <span class="mono mu" style="font-size:13px">${v.cve}</span></h1><span class="pill" style="margin-top:6px;direction:ltr">${mt[1]} · ${mt[2]}</span></div>
    <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
     <button class="btn b" data-a="go" data-v="vulns" style="min-height:44px">المكتبة</button>
     ${nx ? `<button class="btn b" data-a="vopen" data-id="${nx.id}" style="min-height:44px">التالي: ${nx.n}</button>` : ''}
     <div style="display:flex;gap:4px;background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:4px">
      <button data-a="vrole" data-r="red" style="min-height:44px;padding:0 18px;border:none;border-radius:9px;font-weight:600;background:${red ? 'var(--r)' : 'transparent'};color:${red ? 'var(--bg)' : 'var(--mu2)'}">الفريق الأحمر</button>
      <button data-a="vrole" data-r="blue" style="min-height:44px;padding:0 18px;border:none;border-radius:9px;font-weight:600;background:${!red ? 'var(--b)' : 'transparent'};color:${!red ? 'var(--bg)' : 'var(--mu2)'}">الفريق الأزرق</button>
     </div>
    </div>
   </div>
   <div class="row">
    <div class="col" style="flex:1 1 280px">
     <div class="card col" style="gap:0"><h2 style="margin-bottom:12px">خريطة المختبر</h2>
      <div class="node" style="display:flex;justify-content:space-between"><span class="mono">ws-student</span><span class="mu">محطة المتدرّب</span></div>
      <div style="width:2px;height:20px;background:var(--bd);align-self:center"></div>
      <div class="node" style="border-color:${ws[1]}"><div style="display:flex;justify-content:space-between;gap:8px"><span class="mono">${v.host}</span><span class="pill" style="background:${ws[1]};color:var(--bg)">${ws[0]}</span></div><span class="mu">${v.sys}</span></div>
      <div style="width:2px;height:20px;background:var(--bd);align-self:center"></div>
      <div class="node" style="display:flex;justify-content:space-between"><span class="mono">db-srv-02</span><span class="mu">قاعدة بيانات</span></div>
     </div>
     <div class="card"><h2 style="margin-bottom:6px">مهام التمرين</h2>${tasks}<div class="mu" style="border-top:1px solid var(--bd);padding-top:8px;margin-top:6px">نقاط السيناريو <b style="color:var(--y)">${vScore(p)}</b> / 100 · تلميح −٥ · خيار خاطئ −١٠ (اكتب <span class="mono">hint</span>)</div></div>
    </div>
    <div class="col" style="flex:2 1 520px">
     <div class="console"><div class="hd"><span>كونسول المحاكاة</span><span class="mono mu" style="font-size:12px">arena-console · sandbox</span></div>
      <div class="out" id="out"><div style="color:var(--mu)">Metasploit Simulation Arena · training build · ${esc(v.n)}. Type "help".</div>${log}</div>
      <form class="in" id="cmdform"><span style="color:var(--g)">arena &gt;</span><input id="cmd" autocomplete="off" spellcheck="false" aria-label="أمر المحاكاة" placeholder="type a command…"></form>
     </div>
     <div class="card col" style="gap:10px"><span class="mu">أوامر سريعة (انقر أو اكتب بنفسك)</span><div style="display:flex;flex-wrap:wrap;gap:10px">${chips}</div></div>${vReport(v, p)}
    </div>
    <div class="col" style="flex:1 1 320px">${side}</div>
   </div>
  </div>`;
}
/* ===== العرض والأحداث ===== */
function render(keepFocus){
  document.getElementById('nav').innerHTML = VIEWS.map(v => `<button class="${S.view === v[0] || (v[0] === 'vulns' && ['vsim','lab','lab2','chain'].includes(S.view)) ? 'on' : ''}" data-a="go" data-v="${v[0]}">${v[1]}</button>`).join('');
  const fn = { dash: vDash, lab: vLab, lab2: vLab2, vulns: vVulns, vsim: vSim, chain: vChain, debrief: vDebrief }[S.view] || vDash;
  document.getElementById('app').innerHTML = fn();
  document.getElementById('themes').innerHTML = THEMES.map(t => `<button class="${TH === t[0] ? 'on' : ''}" data-a="theme" data-t="${t[0]}">${t[1]}</button>`).join('');
  const out = document.getElementById('out'); if (out) out.scrollTop = out.scrollHeight;
  if (keepFocus) { const i = document.getElementById('cmd'); if (i) i.focus(); }
}
document.addEventListener('click', e => {
  const a = e.target.closest('[data-a]'); if (!a || a.disabled) return;
  const d = a.dataset, L = S.lab;
  switch (d.a) {
    case 'go': S.view = d.v; window.scrollTo(0, 0); break;
    case 'reset': if (confirm('سيتم مسح كل التقدّم المحفوظ. متابعة؟')) { S = fresh(); } else return; break;
    case 'role': L.role = d.r; if (d.r === 'blue' && alerts().length) L.sawAlerts = true; break;
    case 'chip': (S.view === 'vsim' ? runVCmd : runCmd)(d.c); save(); render(true); return;
    case 'choose': L.choice = d.k; if (d.k === 'isolate') ev('—', 'عُزل الخادم وبدأ التحقق من سلامته'); break;
    case 'copen': S.cs = d.id; S.view = 'chain'; window.scrollTo(0, 0); break;
    case 'cstep': chainStep(); break;
    case 'cfa': chainFA(d.k); break;
    case 'cpick': chainPick(d.k); break;
    case 'creset': S.ch[S.cs] = freshChain(S.cs); break;
    case 'theme': TH = d.t; try { localStorage.setItem('arena_theme', TH); } catch(e){} applyTheme(); break;
    case 'vopen': S.v.sel = d.id; S.view = 'vsim'; window.scrollTo(0, 0); break;
    case 'vrole': S.v.role = d.r; if (d.r === 'blue' && vAlerts(curV(), vp()).length) vp().saw = true; break;
    case 'vchoose': { const p = vp(); if (d.k !== 'fix' && p.choice !== d.k) p.wrong = (p.wrong || 0) + 1; p.choice = d.k; break; }
    case 'pick': S.s2.sel = d.id; break;
    case 'verdict': S.s2.verdicts[S.s2.sel] = d.x; break;
  }
  save(); render();
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'cmdform') return;
  e.preventDefault();
  const i = document.getElementById('cmd'); (S.view === 'vsim' ? runVCmd : runCmd)(i.value); i.value = ''; save(); render(true);
});
render();
</script>
